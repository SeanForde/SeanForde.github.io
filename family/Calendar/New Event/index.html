<main class="app">

    <header class="topbar">

        <a href="/family/calendar/">
            ← Cancel
        </a>

    </header>

    <section class="card">

        <p class="eyebrow">
            New Event
        </p>

        <h1>Add Event</h1>

        <form>

            <label>
                Title
            </label>

            <input type="text" placeholder="Dylan Baseball Practice">

            <label>
                Calendar
            </label>

            <select>
                <option>Family Calendar</option>
                <option>Sean Personal</option>
                <option>Sean Work</option>
                <option>Michelle Personal</option>
            </select>

            <label>
                Date
            </label>

            <input type="date">

            <label>
                Start Time
            </label>

            <input type="time">

            <label>
                End Time
            </label>

            <input type="time">

            <label>
                People
            </label>

            <input type="text" placeholder="Sean, Michelle, Dylan">

            <label>
                Location
            </label>

            <input type="text" placeholder="Field, School, Home...">

            <label>
                Notes
            </label>

            <textarea></textarea>

            <button type="submit">
                Create Event
            </button>

        </form>

    </section>

</main>
