<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forde Family HQ</title>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="app">
        <section id="login-view" class="card">
            <div class="lantern">🏮</div>
            <h1>Forde Family HQ</h1>
            <p class="subtext">Sign in with your approved family email.</p>

            <form id="login-form">
                <input id="email-input" type="email" placeholder="your@email.com" required />

                <button type="submit">Send login link</button>
            </form>

            <p id="login-error" class="error"></p>
        </section>

        <section id="family-view" class="hidden">
            <header class="topbar">
                <div>
                    <h1>Forde Family HQ</h1>
                    <p id="user-email" class="subtext"></p>
                </div>
                <button id="sign-out-btn">Sign out</button>
            </header>

            <section class="grid">
                <div class="card">
                    <h2>Today</h2>
                    <p>Calendar view coming next.</p>
                </div>

                <div class="card">
                    <h2>This Week</h2>
                    <p>Family events will live here.</p>
                </div>

                <div class="card">
                    <h2>Quick Links</h2>
                    <a href="https://calendar.google.com" target="_blank">Open Google Calendar</a>
                </div>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>

</html>
