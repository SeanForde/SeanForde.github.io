name: Update Substack Feed

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Substack feed
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://smichaelforde.substack.com/feed" \
            --output substack-feed.xml

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add substack-feed.xml

          if git diff --cached --quiet; then
            echo "Substack feed has not changed."
          else
            git commit -m "Update Substack feed"
            git push
          fi
