name: Update Substack Feed

on:
  schedule:
    # Check Substack once per hour, at 17 minutes past the hour.
    - cron: "17 * * * *"

  # Also lets us run this manually from the GitHub Actions page.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      # Get the current website files.
      - name: Check out repository
        uses: actions/checkout@v5

      # Download the latest RSS feed from Substack.
      - name: Download Substack feed
        run: |
          echo "Requesting Substack RSS feed..."

          curl \
            --fail \
            --location \
            --show-error \
            --user-agent "Mozilla/5.0" \
            --header "Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8" \
            --output substack-feed.xml \
            "https://smichaelforde.substack.com/feed"

      # Make sure we actually received an RSS feed before replacing
      # the copy used by the website.
      - name: Verify feed
        run: |
          echo "Checking downloaded file..."

          test -s substack-feed.xml

          if grep -q "<rss" substack-feed.xml; then
            echo "SUCCESS: Valid RSS feed detected."
          else
            echo "ERROR: Downloaded file is not an RSS feed."
            echo ""
            echo "First 20 lines of downloaded response:"
            head -n 20 substack-feed.xml
            exit 1
          fi

      # Commit only when Substack has actually changed.
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add substack-feed.xml

          if git diff --cached --quiet; then
            echo "Substack feed has not changed."
          else
            git commit -m "Update Substack feed"
            git push
          fi
