name: Update Substack Feed 

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Substack feed
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
            --header "Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8" \
            "https://smichaelforde.substack.com/feed" \
            --output substack-feed.xml

      - name: Verify feed
        run: |
          test -s substack-feed.xml
          grep -q "<rss" substack-feed.xml
          echo "Substack RSS feed downloaded successfully."

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add substack-feed.xml

          if git diff --cached --quiet; then
            echo "Substack feed has not changed."
          else
            git commit -m "Update Substack feed"
            git push
          fi
